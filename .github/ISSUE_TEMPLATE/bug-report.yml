name: Bug report
description: Report a reproducible CLI, import, adapter, or generated-output bug.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a reproducible Pluribus bug. Please include the smallest command sequence that shows the problem.

        For the published npm package, prefer `npx --yes pluribus-context@latest ...` in reproductions so the version is explicit and non-interactive.

        Please do not paste secrets, private source code, credentials, customer data, or internal instructions that should not be public.
  - type: input
    id: version
    attributes:
      label: Pluribus version
      description: Run `npx --yes pluribus-context@latest --version` or `pluribus --version`.
      placeholder: "Paste the exact --version output"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.13.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15 / Ubuntu 24.04 / Windows 11"
    validations:
      required: false
  - type: textarea
    id: commands
    attributes:
      label: Minimal reproduction commands
      render: shell
      placeholder: |
        npx --yes pluribus-context@latest init --tools claude,cursor
        npx --yes pluribus-context@latest validate
        npx --yes pluribus-context@latest sync --dry-run
    validations:
      required: true
  - type: textarea
    id: pluribus-md
    attributes:
      label: Minimal pluribus.md
      description: Paste a reduced example only. Do not include secrets or private company context.
      render: markdown
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error output
      render: text
    validations:
      required: true
